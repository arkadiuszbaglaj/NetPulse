# UplinkView – wejście do panelu. HTTP na 8080 (port NETPULSE_PORT na serwerze), HTTPS na 8443 (NETPULSE_HTTPS_PORT).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log off;

    # Kopie zapasowe (wgrywanie, pobieranie) i zadania aktualizacji: bez limitu rozmiaru i buforowania,
    # limity pilnuje API
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Kompresja (od 0.67.0): pliki panelu i odpowiedzi JSON kurczą się ok. trzykrotnie – pierwsze wejście to ~0,4 MB
    # zamiast ~1,1 MB (liczy się przez VPN, VPS i telefon). Kopie zapasowe (application/gzip) i obrazy pomijamy.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
               application/xml image/svg+xml text/x-shellscript;

    # Adres API rozwiązywany przy każdym żądaniu (DNS Dockera): proxy startuje, nawet gdy API jeszcze nie działa
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        include /etc/nginx/proxy-common.conf;
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:tls:5m;
        include /etc/nginx/proxy-common.conf;
    }
}
