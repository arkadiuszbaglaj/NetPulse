# NetPulse – wejście do panelu. HTTP na 8080 (port NETPULSE_PORT na serwerze), HTTPS na 8443 (NETPULSE_HTTPS_PORT).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log off;

    # Kopie zapasowe (wgrywanie, pobieranie) i zadania aktualizacji: bez limitu rozmiaru i buforowania,
    # limity pilnuje API
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Adres API rozwiązywany przy każdym żądaniu (DNS Dockera): proxy startuje, nawet gdy API jeszcze nie działa
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        include /etc/nginx/proxy-common.conf;
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:tls:5m;
        include /etc/nginx/proxy-common.conf;
    }
}
