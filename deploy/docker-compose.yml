name: netpulse

# Utwardzenie kontenerów (od 0.68.0): proces nie zdobędzie nowych uprawnień (setuid), a uprawnienia jądra (capabilities)
# są odebrane wszystkie albo zostawione tylko te, bez których usługa nie wystartuje.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: netpulse-backend:local
  restart: unless-stopped
  # API i kolektor działają jako zwykły użytkownik (uid 10001) – nie potrzebują żadnych uprawnień jądra.
  # Ping sprawdzeń dostępności używa gniazda ICMP bez uprawnień (SOCK_DGRAM), nie CAP_NET_RAW.
  <<: *hardened
  environment:
    NETPULSE_DATABASE_URL: postgresql+asyncpg://netpulse:${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}@db:5432/netpulse
    NETPULSE_POLL_INTERVAL: ${NETPULSE_POLL_INTERVAL:-30}
    NETPULSE_RETENTION_DAYS: ${NETPULSE_RETENTION_DAYS:-30}
    # Kompresja metryk starszych niż tyle dni (od 0.67.0); 0 = bez kompresji
    NETPULSE_COMPRESS_AFTER_DAYS: ${NETPULSE_COMPRESS_AFTER_DAYS:-7}
    NETPULSE_LOG_LEVEL: ${NETPULSE_LOG_LEVEL:-INFO}
    # Klucz szyfrowania sekretów w bazie: plik w wolumenie keys (powstaje sam); zmienna z .env ma pierwszeństwo
    NETPULSE_SECRET_KEY: ${NETPULSE_SECRET_KEY:-}
    TZ: ${TZ:-Europe/Warsaw}
    # Aktualizacja z panelu: API rozmawia z usługą updater (sieć wewnętrzna); token jest w wolumenie
    # updater-secret (tworzy go usługa aktualizacji przy pierwszym starcie)
    NETPULSE_UPDATER_URL: http://updater:8080
    NETPULSE_UPDATER_TOKEN_FILE: /run/netpulse/updater-token
    # HTTPS (od 0.62.0, używa tylko API): certyfikat z kontenera proxy, port do linków w panelu; API nie ma
    # opublikowanego portu, więc nagłówki X-Forwarded-* mogą przyjść tylko z sieci wewnętrznej (proxy)
    NETPULSE_TLS_DIR: /tls
    NETPULSE_HTTPS_PORT: ${NETPULSE_HTTPS_PORT:-8443}
    NETPULSE_FORWARDED_ALLOW_IPS: "*"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    # Wersja przypięta (od 0.68.0; wcześniej `latest`). Podniesienie = zmiana tutaj i w ci.yml; rozszerzenie w bazie
    # aktualizuje `init_db` (ALTER EXTENSION … UPDATE). Nie obniżać – baza nie cofnie wersji rozszerzenia.
    image: timescale/timescaledb:2.32.0-pg17
    restart: unless-stopped
    # PostgreSQL startuje jako root, zmienia właściciela katalogu danych i przechodzi na użytkownika postgres
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: netpulse
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse -d netpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    <<: *backend
    command: ["sh", "-c", "netpulse db init && exec netpulse collector"]
    volumes:
      - keys:/var/lib/netpulse

  # Bez opublikowanego portu – panel i agenci łączą się przez proxy (HTTP i HTTPS)
  api:
    <<: *backend
    command: ["netpulse", "api"]
    volumes:
      - updater-secret:/run/netpulse:ro
      - keys:/var/lib/netpulse
      - ${NETPULSE_DIR:?ustaw NETPULSE_DIR w .env}/deploy/tls:/tls
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Wejście do panelu (od 0.62.0): HTTP na NETPULSE_PORT (jak dotąd) i HTTPS na NETPULSE_HTTPS_PORT.
  # Certyfikat lokalnego CA NetPulse (albo własny w deploy/tls/custom/) – patrz deploy/proxy/tls.sh
  proxy:
    build:
      context: ..
      dockerfile: deploy/proxy/Dockerfile
    image: netpulse-proxy:local
    restart: unless-stopped
    # nginx: proces główny jako root (certyfikaty w /tls, przejście procesów roboczych na użytkownika nginx,
    # sygnały do nich przy przeładowaniu po odnowieniu certyfikatu – KILL)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    environment:
      NETPULSE_TLS_NAMES: ${NETPULSE_TLS_NAMES:-}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ${NETPULSE_DIR:?ustaw NETPULSE_DIR w .env}/deploy/tls:/tls
    ports:
      - "${NETPULSE_PORT:-8000}:8080"
      - "${NETPULSE_HTTPS_PORT:-8443}:8443"
    depends_on:
      - api

  # Usługa aktualizacji: jedyny kontener z dostępem do Dockera. Nie ma opublikowanego portu –
  # rozmawia z nią tylko API (token), a aktualizację może zlecić wyłącznie administrator.
  # Katalog instalacji jest montowany pod TĄ SAMĄ ścieżką co na serwerze: docker compose
  # przekazuje demonowi ścieżki hosta (kontekst budowania, plik .env).
  updater:
    build:
      context: ..
      dockerfile: updater/Dockerfile
    image: netpulse-updater:local
    restart: unless-stopped
    # Ma gniazdo Dockera (czyli pełną kontrolę nad serwerem) – odebranie uprawnień jądra nic by tu nie dało
    security_opt:
      - no-new-privileges:true
    environment:
      NETPULSE_UPDATER: ${NETPULSE_UPDATER:-on}
      NETPULSE_UPDATER_TOKEN_FILE: /run/netpulse/updater-token
      NETPULSE_DIR: ${NETPULSE_DIR:?ustaw NETPULSE_DIR w .env (katalog instalacji)}
      NETPULSE_UPDATE_REPO: ${NETPULSE_UPDATE_REPO:-}
      NETPULSE_UPDATE_BRANCH: ${NETPULSE_UPDATE_BRANCH:-}
      NETPULSE_MIN_FREE_MB: ${NETPULSE_MIN_FREE_MB:-2000}
      NETPULSE_MAX_UPLOAD_MB: ${NETPULSE_MAX_UPLOAD_MB:-4096}
      NETPULSE_KEEP_BUILD_CACHE_HOURS: ${NETPULSE_KEEP_BUILD_CACHE_HOURS:-72}
      NETPULSE_BUILD_CACHE_MAX: ${NETPULSE_BUILD_CACHE_MAX:-2gb}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NETPULSE_DIR:?ustaw NETPULSE_DIR w .env}:${NETPULSE_DIR}
      - updater-secret:/run/netpulse

volumes:
  db-data:
  # Klucz szyfrowania sekretów w bazie (community SNMP, klucze API, webhooki) – przenosić razem z kopią bazy
  keys:
  # Token API ↔ updater: zapisuje go updater, API tylko czyta
  updater-secret:
