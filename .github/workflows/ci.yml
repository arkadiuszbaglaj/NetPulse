name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – lint i testy
    runs-on: ubuntu-24.04
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: netpulse
          POSTGRES_USER: netpulse
          POSTGRES_PASSWORD: netpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netpulse -d netpulse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NETPULSE_DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@localhost:5432/netpulse
      NETPULSE_TEST_DB: "1"
      NETPULSE_DB_NULLPOOL: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalacja
        run: |
          pip install -e ".[dev]" 2>&1 | tee ../pip.log
          pip freeze | grep -iE "pysnmp|snmpsim|sqlalchemy|fastapi|asyncpg|pyasn1" | tee ../versions.log
      - name: Ruff
        run: ruff check --output-format=concise netpulse tests tools 2>&1 | tee ../ruff.log; exit ${PIPESTATUS[0]}
      - name: Pytest
        if: always()
        run: python -m pytest -v -rs --tb=short 2>&1 | tee ../pytest.log; exit ${PIPESTATUS[0]}
      - name: Raport błędów
        if: failure()
        working-directory: .
        run: |
          bash .github/scripts/annotate.sh pip.log "pip" 40
          bash .github/scripts/annotate.sh ruff.log "ruff" 60
          bash .github/scripts/annotate.sh versions.log "wersje" 20
          grep -E '^(FAILED|ERROR)|^E |Error|assert' pytest.log | head -80 > pytest-summary.log || true
          bash .github/scripts/annotate.sh pytest-summary.log "pytest – podsumowanie" 80
          bash .github/scripts/annotate.sh pytest.log "pytest" 60

  frontend:
    name: Panel – typy, testy, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typy (TypeScript)
        run: npm run typecheck
      - name: Testy
        run: npm test
      - name: Build
        run: npm run build

  install:
    name: Instalacja jednym linkiem + update (end-to-end)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Symulator urządzeń (snmpsim z danymi UniFi)
        run: |
          pip install snmpsim pysmi
          mkdir -p /tmp/snmpsim-cache
          nohup snmpsim-command-responder --data-dir=backend/tests/fixtures \
            --cache-dir=/tmp/snmpsim-cache --agent-udpv4-endpoint=0.0.0.0:1161 > snmpsim.log 2>&1 &
          sleep 3
      - name: install.sh (jak u użytkownika)
        run: |
          sudo NETPULSE_REPO="https://github.com/${{ github.repository }}.git" \
               NETPULSE_BRANCH="${{ github.ref_name }}" \
               bash install.sh 2>&1 | tee install.log; exit ${PIPESTATUS[0]}
      - name: Szybszy interwał do testu
        run: |
          sudo sed -i 's/^NETPULSE_POLL_INTERVAL=.*/NETPULSE_POLL_INTERVAL=5/' /opt/netpulse/deploy/.env
          sudo docker compose -f /opt/netpulse/deploy/docker-compose.yml --env-file /opt/netpulse/deploy/.env up -d
      - name: netpulse probe / device add
        run: |
          GW=$(sudo docker network inspect netpulse_default -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "Brama sieci Dockera: $GW"
          sudo netpulse version
          netpulse help | grep -q "netpulse reset"
          netpulse help | grep -q "netpulse cleanup"
          # bez sudo – skrypt sam podnosi uprawnienia (need_root)
          netpulse status 2>&1 | tee status.log
          if grep -q "'-E' is ignored" status.log; then exit 1; fi
          sudo netpulse probe "$GW" --port 1161 --community ucg-ultra 2>&1 | tee probe.log
          grep -q "WAN" probe.log
          sudo netpulse device add "UCG Ultra" "$GW" --port 1161 --community ucg-ultra 2>&1 | tee -a probe.log
          sudo netpulse device list 2>&1 | tee -a probe.log
      - name: Panel serwowany z obrazu API
        run: |
          API=http://127.0.0.1:8000
          # (zmienne zamiast `curl | grep -q`: przy pipefail grep zamykający rurę psułby wynik)
          PAGE=$(curl -fsS $API/)
          echo "$PAGE" > panel.log
          grep -q '<div id="root">' <<<"$PAGE"
          # adresy aplikacji dostają ten sam index.html (routing po stronie przeglądarki)
          SUB=$(curl -fsS $API/settings/account)
          grep -q '<div id="root">' <<<"$SUB"
          # zbudowany plik JS z /assets jest dostępny
          JS=$(grep -o '/assets/[^"]*\.js' <<<"$PAGE" | head -1)
          echo "JS=$JS" | tee -a panel.log
          curl -fsS -o /dev/null -w '%{http_code} %{content_type}\n' "$API$JS" | tee -a panel.log
          # nieistniejący endpoint API to JSON 404, a nie strona panelu
          test "$(curl -s -o /dev/null -w '%{http_code}' $API/api/nie-ma)" = 404
          NOAPI=$(curl -s $API/api/nie-ma)
          grep -q '"detail"' <<<"$NOAPI"
          # ikony i manifest (favicon z logo)
          for f in favicon.ico favicon.svg apple-touch-icon.png manifest.webmanifest; do
            curl -fsS -o /dev/null -w "$f %{http_code} %{content_type}\n" "$API/$f" | tee -a panel.log
          done
          MANIFEST=$(curl -fsS $API/manifest.webmanifest)
          grep -q '"NetPulse"' <<<"$MANIFEST"
          # kompresja gzip w proxy (od 0.67.0): plik panelu wraca skompresowany, gdy przeglądarka o to prosi
          curl -fsS -H 'Accept-Encoding: gzip' -D gzip-headers.txt -o /dev/null "$API$JS"
          grep -qi '^content-encoding: gzip' gzip-headers.txt
          # nagłówki bezpieczeństwa; dokumentacja API i numer wersji tylko po zalogowaniu (od 0.65.6)
          curl -fsS -D headers.txt -o /dev/null $API/
          grep -qi '^x-frame-options: SAMEORIGIN' headers.txt
          grep -qi "^content-security-policy: frame-ancestors 'self'" headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' $API/openapi.json)" = 401
          HEALTH=$(curl -fsS $API/api/health)
          if grep -q '"version"' <<<"$HEALTH"; then echo "health zdradza wersję"; exit 1; fi
      - name: Kreator konta i logowanie
        run: |
          API=http://127.0.0.1:8000
          # bez logowania dane są zamknięte
          test "$(curl -s -o /dev/null -w '%{http_code}' $API/api/devices)" = 401
          curl -fsS $API/api/auth/status | tee auth.log; echo
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"haslo-ci-12345"}' $API/api/auth/setup | tee -a auth.log; echo
          # awaryjna zmiana hasła z CLI, potem logowanie nowym hasłem
          echo "nowe-haslo-ci-1" | sudo netpulse user passwd admin --password-stdin 2>&1 | tee -a auth.log
          sudo netpulse user list 2>&1 | tee -a auth.log
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt $API/api/devices)" = 401
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"nowe-haslo-ci-1"}' $API/api/auth/login | tee -a auth.log; echo
          # po zalogowaniu dokumentacja API działa
          OPENAPI=$(curl -fsS -b cookies.txt $API/openapi.json)
          grep -q '/api/auth/setup' <<<"$OPENAPI"
      - name: HTTPS przez proxy (lokalne CA)
        run: |
          dc() { sudo docker compose -f /opt/netpulse/deploy/docker-compose.yml --env-file /opt/netpulse/deploy/.env "$@"; }
          for i in $(seq 1 30); do sudo test -s /opt/netpulse/deploy/tls/server.pem && break; sleep 2; done
          sudo ls -l /opt/netpulse/deploy/tls | tee https.log
          sudo grep '^NETPULSE_TLS_NAMES=' /opt/netpulse/deploy/.env | tee -a https.log
          sudo cp /opt/netpulse/deploy/tls/ca.pem ca.pem && sudo chmod 644 ca.pem
          # klucz CA nie jest dostępny dla wszystkich
          test "$(sudo stat -c %a /opt/netpulse/deploy/tls/ca-key.pem)" = 600
          curl -fsS --cacert ca.pem https://localhost:8443/api/health | tee -a https.log; echo
          curl -fsS --cacert ca.pem https://127.0.0.1:8443/api/health
          # certyfikat obejmuje adres serwera z instalatora
          IP=$(ip -4 -o addr show scope global | awk '$2 !~ /^(docker|br-|veth)/ {sub(/\/.*/, "", $4); print $4; exit}')
          echo "IP=$IP" | tee -a https.log
          curl -fsS --cacert ca.pem "https://$IP:8443/api/health"
          # panel i WebSocket-owy nagłówek przechodzą przez proxy
          PAGE=$(curl -fsS --cacert ca.pem https://127.0.0.1:8443/)
          grep -q '<div id="root">' <<<"$PAGE"
          # logowanie przez HTTPS daje ciasteczko Secure (X-Forwarded-Proto od proxy)
          curl -fsS --cacert ca.pem -c https-cookies.txt -H 'Content-Type: application/json'             -d '{"username":"admin","password":"nowe-haslo-ci-1"}' https://127.0.0.1:8443/api/auth/login >/dev/null
          awk '$7 != "" && $1 ~ /127.0.0.1/ {print $4}' https-cookies.txt | grep -q TRUE
          TLS=$(curl -fsS --cacert ca.pem -b https-cookies.txt https://127.0.0.1:8443/api/system/tls)
          echo "$TLS" | tee -a https.log
          python3 - "$TLS" "$IP" <<'PY'
          import json, sys
          s, ip = json.loads(sys.argv[1]), sys.argv[2]
          assert s["available"] and s["mode"] == "local" and s["https"] and s["https_port"] == 8443, s
          assert ip in s["names"] and "localhost" in s["names"], s
          PY
          # pobranie CA z panelu = ten sam plik
          curl -fsS --cacert ca.pem -b https-cookies.txt -o ca-panel.pem https://127.0.0.1:8443/api/system/tls/ca.pem
          cmp ca.pem ca-panel.pem
          # adres dopisany w panelu trafia do certyfikatu (proxy sprawdza co 30 s)
          curl -fsS --cacert ca.pem -b https-cookies.txt -X PUT -H 'Content-Type: application/json'             -d '{"names":["netpulse-ci.test"]}' https://127.0.0.1:8443/api/system/tls/names >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS --cacert ca.pem --resolve netpulse-ci.test:8443:127.0.0.1 https://netpulse-ci.test:8443/api/health >/dev/null 2>&1; then OK=1; break; fi
            sleep 3
          done
          test "${OK:-0}" = 1
          # dziennik zdarzeń widzi prawdziwy adres klienta (X-Forwarded-For), nie adres proxy
          PROXY_IP=$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(dc ps -q proxy)")
          AUDIT=$(curl -fsS --cacert ca.pem -b https-cookies.txt "https://127.0.0.1:8443/api/audit?kind=auth&limit=1")
          echo "proxy=$PROXY_IP audit=$AUDIT" | tee -a https.log
          python3 - "$AUDIT" "$PROXY_IP" <<'PY'
          import json, sys
          e, proxy = json.loads(sys.argv[1])["items"][0], sys.argv[2]
          assert e["action"] == "login" and e["ip"] and e["ip"] != proxy, (e, proxy)
          PY
          # API nie ma już opublikowanego portu – wszystko idzie przez proxy
          BINDINGS=$(sudo docker inspect -f '{{json .HostConfig.PortBindings}}' "$(dc ps -q api)")
          echo "porty API: $BINDINGS" | tee -a https.log
          if grep -q '8000' <<<"$BINDINGS"; then echo "API ma opublikowany port"; exit 1; fi
      - name: Kolektor zapisuje dane, API je zwraca
        run: |
          api() { curl -fsS -b cookies.txt "http://127.0.0.1:8000$1"; }
          for i in $(seq 1 30); do
            STATUS=$(api /api/devices | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['status'] if d else 'none')")
            [ "$STATUS" = "up" ] && break
            sleep 2
          done
          api /api/devices | tee api.log
          echo
          api /api/devices/1/interfaces | tee -a api.log
          echo
          [ "$STATUS" = "up" ]
          api /api/devices/1/interfaces | python3 -c "
          import sys, json
          labels = [p['label'] for p in json.load(sys.stdin)]
          print(labels)
          assert labels == ['WAN', 'LAN 1', 'LAN 2', 'LAN 3', 'LAN 4'], labels
          "
      - name: Sekrety zaszyfrowane w bazie
        run: |
          dc() { sudo docker compose -f /opt/netpulse/deploy/docker-compose.yml --env-file /opt/netpulse/deploy/.env "$@"; }
          STORED=$(dc exec -T db psql -U netpulse -d netpulse -tAc "SELECT community FROM devices LIMIT 1")
          echo "community w bazie: ${STORED:0:12}…"
          case "$STORED" in enc:v1:*) ;; *) echo "community nie jest zaszyfrowane"; exit 1 ;; esac
          # klucz powstał sam w wolumenie i obie usługi go widzą
          test "$(dc exec -T api sh -c 'wc -c < /var/lib/netpulse/secret.key')" -ge 64
          test "$(dc exec -T api cat /var/lib/netpulse/secret.key)" = "$(dc exec -T collector cat /var/lib/netpulse/secret.key)"
      - name: Dane pulpitu
        run: |
          api() { curl -fsS -b cookies.txt "http://127.0.0.1:8000$1"; }
          SUMMARY=$(api /api/dashboard/summary)
          echo "$SUMMARY" | tee dashboard.log
          python3 - "$SUMMARY" <<'PY'
          import json, sys
          s = json.loads(sys.argv[1])
          assert s["devices"]["total"] == 1 and s["devices"]["up"] == 1, s
          assert s["poll_interval_s"] == 5, s  # NETPULSE_POLL_INTERVAL z .env dociera do API
          assert s["wan"]["interfaces"] == 1, s  # eth4 oznaczony jako WAN
          PY
          for kind in traffic wifi; do
            OUT=$(api "/api/dashboard/$kind?minutes=15")
            echo "$kind: $OUT" | tee -a dashboard.log
            python3 - "$OUT" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          assert d["interval_s"] == 30 and isinstance(d["points"], list), d
          PY
          done
      - name: Agent serwera Linux (instalacja jednym poleceniem z panelu)
        run: |
          API=http://127.0.0.1:8000
          api() { curl -fsS -b cookies.txt -H 'Content-Type: application/json' "$@"; }
          # świeża instalacja: integracje są wyłączone, dopóki nie włączy się ich w Ustawienia → Moduły
          MODS=$(api $API/api/modules)
          echo "$MODS" | tee agent.log
          test "$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); print(d['agents'], d['proxmox'], d['backups'])" "$MODS")" = "False False True"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -H 'Content-Type: application/json' -d '{"name":"x"}' $API/api/agents)" = 409
          api -X PUT -d '{"agents":true}' $API/api/modules
          OUT=$(api -X POST -d '{"name":"Runner CI"}' $API/api/agents)
          TOKEN=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['token'])" "$OUT")
          DEV=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['agent']['device_id'])" "$OUT")
          # polecenie jak w panelu (Ustawienia → Agenci)
          curl -fsSL $API/agent/install.sh | sudo bash -s -- --url $API --token "$TOKEN" 2>&1 | tee -a agent.log
          systemctl is-active netpulse-agent
          SERVER=null
          for i in $(seq 1 30); do
            SERVER=$(api $API/api/devices/$DEV/server)
            [ "$SERVER" != "null" ] && break
            sleep 2
          done
          echo "$SERVER" | tee -a agent.log
          python3 - "$SERVER" <<'PY'
          import json, sys
          s = json.loads(sys.argv[1])
          assert s and s["cpu_percent"] is not None and s["mem_used_percent"] is not None, s
          assert any(d["mount"] == "/" for d in s["disks"]), s["disks"]
          a = s["agent"]
          assert a and a["services"]["running"] > 0, a
          assert a["containers"] and any(c["name"].startswith("netpulse") for c in a["containers"]), a["containers"]
          PY
          AGENTS=$(api $API/api/agents)
          echo "$AGENTS" | tee -a agent.log
          python3 -c "import json,sys; a=json.loads(sys.argv[1])[0]; assert a['status']=='up' and a['hostname'], a" "$AGENTS"
          # ponowna instalacja bez tokenu = aktualizacja (konfiguracja zostaje)
          curl -fsSL $API/agent/install.sh | sudo bash -s -- 2>&1 | tee -a agent.log
          sudo journalctl -u netpulse-agent --no-pager -n 20 | tee -a agent.log
          # usunięcie: urządzenie w panelu i agent na serwerze
          api -X DELETE $API/api/devices/$DEV
          curl -fsSL $API/agent/install.sh | sudo bash -s -- --uninstall 2>&1 | tee -a agent.log
          if systemctl is-active --quiet netpulse-agent; then echo "agent nadal działa"; exit 1; fi
          test ! -e /etc/netpulse-agent.conf
      - name: Kopia zapasowa z panelu (utworzenie, pobranie, przywrócenie)
        run: |
          API=http://127.0.0.1:8000
          api() { curl -fsS -b cookies.txt -H 'Content-Type: application/json' "$@"; }
          json() { python3 -c "import json,sys; d=json.loads(sys.stdin.read()); print($1)"; }
          OUT=$(api -X POST $API/api/backups)
          echo "$OUT" | tee backups.log
          NAME=$(json 'd["backups"][0]["name"]' <<<"$OUT")
          case "$NAME" in netpulse-manual-*.sql.gz) ;; *) echo "zła nazwa: $NAME"; exit 1 ;; esac
          curl -fsS -b cookies.txt -o backup.sql.gz "$API/api/backups/$NAME/download"
          gzip -t backup.sql.gz
          zcat backup.sql.gz | grep -q "CREATE TABLE public.devices"
          # wgranie pobranej kopii z „komputera” – serwer nadaje nazwę i sprawdza plik
          UP=$(curl -fsS -b cookies.txt -H 'Content-Type: application/gzip' --data-binary @backup.sql.gz "$API/api/backups/upload")
          echo "$UP" | tee -a backups.log
          test "$(json 'd["backups"][0]["kind"]' <<<"$UP")" = upload
          echo "to nie jest kopia" | gzip > zly.sql.gz
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -H 'Content-Type: application/gzip' --data-binary @zly.sql.gz "$API/api/backups/upload")" = 400
          # zmiana po kopii – po przywróceniu ma zniknąć
          api -X POST -d '{"name":"Po kopii","kind":"device_offline"}' $API/api/alert-rules >/dev/null
          api $API/api/alert-rules | grep -q "Po kopii"
          api -X POST "$API/api/backups/$NAME/restore" | tee -a backups.log
          STATE=running
          for i in $(seq 1 90); do
            OUT=$(api $API/api/backups 2>/dev/null || true)
            STATE=$(json 'd["restore"]["state"]' <<<"$OUT" 2>/dev/null || echo running)
            echo "[$i] przywracanie: $STATE"
            case "$STATE" in ok | failed) break ;; esac
            sleep 2
          done
          echo "$OUT" | tee -a backups.log
          test "$STATE" = ok
          curl -fsS $API/api/health
          if api $API/api/alert-rules | grep -q "Po kopii"; then echo "przywracanie nie cofnęło zmian"; exit 1; fi
          test "$(api $API/api/devices | json 'len(d)')" = 1
          # kopia bezpieczeństwa sprzed przywrócenia jest na liście
          json '[b["kind"] for b in d["backups"]]' <<<"$OUT" | grep -q prerestore
          # kopia z konsoli
          sudo netpulse backup 2>&1 | tee -a backups.log
          sudo ls -l /opt/netpulse/backups | tee -a backups.log
      - name: Za mało miejsca – aktualizacja zatrzymuje się, nic nie psując
        run: |
          # Progi ustawione absurdalnie wysoko, żeby wymusić brak miejsca
          if sudo NETPULSE_MIN_FREE_MB=999999999 NETPULSE_WARN_FREE_MB=999999999 netpulse update --force > lowdisk.log 2>&1; then
            echo "Aktualizacja powinna się zatrzymać przy braku miejsca"; cat lowdisk.log; exit 1
          fi
          cat lowdisk.log
          grep -q "Za mało miejsca na dysku" lowdisk.log
          grep -q "Nic nie zostało zmienione" lowdisk.log
          # usługi nadal działają na dotychczasowej wersji
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS -b cookies.txt http://127.0.0.1:8000/api/auth/me
      - name: netpulse cleanup
        run: |
          sudo netpulse cleanup 2>&1 | tee cleanup.log
          grep -q "Wolne miejsce" cleanup.log
          curl -fsS http://127.0.0.1:8000/api/health
      - name: netpulse update
        run: |
          sudo netpulse update --force 2>&1 | tee update.log; test ${PIPESTATUS[0]} -eq 0
          curl -fsS http://127.0.0.1:8000/api/health
          # sesja logowania przetrwała aktualizację
          curl -fsS -b cookies.txt http://127.0.0.1:8000/api/auth/me
      - name: Aktualizacja z panelu (usługa updater)
        timeout-minutes: 30
        run: |
          API=http://127.0.0.1:8000
          api() { curl -fsS -b cookies.txt -H 'Content-Type: application/json' "$@"; }
          json() { python3 -c "import json,sys; d=json.loads(sys.stdin.read()); print($1)"; }

          # usługa aktualizacji działa i jest dostępna z API
          STATUS=$(api $API/api/updates)
          echo "$STATUS" | tee updater.log
          test "$(json 'd["updater"]["configured"] and d["updater"]["reachable"]' <<<"$STATUS")" = True
          test "$(json 'd["job"]["state"]' <<<"$STATUS")" = idle

          # cofamy instalację o jeden commit, żeby było co aktualizować
          WANT=$(sudo git -C /opt/netpulse rev-parse HEAD)
          sudo git -C /opt/netpulse reset --hard HEAD~1 >/dev/null
          WANT_SHORT=$(sudo git -C /opt/netpulse rev-parse --short "$WANT")

          CHECK=$(api -X POST $API/api/updates/check)
          echo "$CHECK" | tee -a updater.log
          test "$(json 'd["info"]["update_available"]' <<<"$CHECK")" = True
          test "$(json 'd["info"]["behind"]' <<<"$CHECK")" = 1
          test "$(json 'd["info"]["latest"]["commit"]' <<<"$CHECK")" = "$WANT_SHORT"

          # aktualizacja: kod, kopia bazy, budowanie, restart usług, test zdrowia
          api -X POST $API/api/updates/apply | tee -a updater.log
          echo
          STATE=running
          for i in $(seq 1 240); do
            OUT=$(api $API/api/updates 2>/dev/null || true)
            STATE=$(json '(d.get("job") or {}).get("state", "?")' <<<"${OUT:-{\}}" 2>/dev/null || echo "?")
            echo "[$i] stan: $STATE"
            case "$STATE" in ok | failed | rolled_back) break ;; esac
            sleep 5
          done
          echo "$OUT" > updater-final.json
          json '"\n".join(d["job"]["log"][-60:])' <<<"$OUT" | tee -a updater.log || true
          test "$STATE" = ok

          # efekt: kod w docelowej wersji, kopia bazy z prawdziwą zawartością, usługi i dane na miejscu
          test "$(sudo git -C /opt/netpulse rev-parse HEAD)" = "$WANT"
          BACKUP=$(ls /opt/netpulse/backups/netpulse-*.sql.gz | head -1)
          # kopia ma prawa 0600 (tylko root) – to celowe, bo zawiera całą bazę
          test "$(sudo stat -c %a "$BACKUP")" = 600
          DUMP_HEAD=$(sudo zcat "$BACKUP" | head -c 400 || true)
          grep -q "PostgreSQL database dump" <<<"$DUMP_HEAD"

          # kopię da się odtworzyć: ta sama procedura, która jest opisana w dokumentacji
          dc() { sudo docker compose -f /opt/netpulse/deploy/docker-compose.yml --env-file /opt/netpulse/deploy/.env "$@"; }
          dc exec -T db psql -U netpulse -d postgres -c "CREATE DATABASE restore_test"
          dc exec -T db psql -U netpulse -d restore_test -c "CREATE EXTENSION IF NOT EXISTS timescaledb" -c "SELECT timescaledb_pre_restore()"
          sudo zcat "$BACKUP" | dc exec -T db psql -U netpulse -d restore_test -q > restore.log 2>&1 || true
          dc exec -T db psql -U netpulse -d restore_test -c "SELECT timescaledb_post_restore()"
          test "$(dc exec -T db psql -U netpulse -d restore_test -tAc 'SELECT count(*) FROM devices')" = 1
          test "$(dc exec -T db psql -U netpulse -d restore_test -tAc 'SELECT count(*) FROM users')" = 1
          dc exec -T db psql -U netpulse -d postgres -c "DROP DATABASE restore_test"
          curl -fsS $API/api/health
          api $API/api/auth/me
          FINAL=$(api $API/api/updates)
          test "$(json 'd["job"]["state"]' <<<"$FINAL")" = ok
          test "$(json 'd["job"]["to_commit"]' <<<"$FINAL")" = "$WANT_SHORT"
          test "$(api $API/api/devices | json 'len(d)')" = 1
      - name: Raport błędów
        if: failure()
        run: |
          sudo docker compose -f /opt/netpulse/deploy/docker-compose.yml --env-file /opt/netpulse/deploy/.env logs --tail=80 > compose.log 2>&1 || true
          sudo docker logs --tail 60 netpulse-updater-1 > updater-container.log 2>&1 || true
          sudo docker logs --tail 80 netpulse-update-job > updater-job.log 2>&1 || true
          bash .github/scripts/annotate.sh restore.log "odtwarzanie kopii" 40
          bash .github/scripts/annotate.sh updater.log "aktualizacja z panelu" 80
          bash .github/scripts/annotate.sh updater-container.log "kontener updater" 40
          bash .github/scripts/annotate.sh updater-job.log "zadanie aktualizacji" 60
          bash .github/scripts/annotate.sh install.log "install.sh" 60
          bash .github/scripts/annotate.sh probe.log "probe" 60
          bash .github/scripts/annotate.sh agent.log "agent serwera" 60
          bash .github/scripts/annotate.sh backups.log "kopia zapasowa" 60
          bash .github/scripts/annotate.sh panel.log "panel" 40
          bash .github/scripts/annotate.sh auth.log "logowanie" 40
          bash .github/scripts/annotate.sh https.log "https" 40
          bash .github/scripts/annotate.sh lowdisk.log "mało miejsca" 40
          bash .github/scripts/annotate.sh cleanup.log "cleanup" 20
          bash .github/scripts/annotate.sh dashboard.log "dashboard" 40
          bash .github/scripts/annotate.sh api.log "api" 40
          bash .github/scripts/annotate.sh update.log "update" 40
          bash .github/scripts/annotate.sh snmpsim.log "snmpsim" 30
          bash .github/scripts/annotate.sh compose.log "docker compose logs" 150
