# Tylko dla programisty (nowa migracja): w katalogu backend/
#   NETPULSE_DATABASE_URL=... alembic revision --autogenerate -m "opis zmiany"
# Instalacja tego pliku nie potrzebuje – migracje uruchamia `netpulse db init` (patrz docs/13-migracje-bazy.md).
[alembic]
script_location = netpulse/db/migrations
file_template = %%(rev)s_%%(slug)s
