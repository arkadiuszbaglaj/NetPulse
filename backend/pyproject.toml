[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "netpulse"
dynamic = ["version"]
description = "NetPulse – self-hosted monitoring ruchu sieciowego (router, switch, access point)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",  # migracje schematu bazy
    "pysnmp>=7.1,<8",
    "cryptography>=43",  # szyfrowanie SNMPv3 (AES/DES)
    "tzdata>=2024.1",  # strefy czasowe niezależnie od obrazu systemu
    "argon2-cffi>=23.1",  # hashowanie haseł
    "httpx>=0.27",  # rozmowa z usługą aktualizacji
    "segno>=1.6",  # kod QR z linkiem do pulpitu publicznego
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "snmpsim>=1.1",
    "pysmi>=1.5",
    "ruff>=0.8",
]

[project.scripts]
netpulse = "netpulse.cli:main"

[tool.hatch.version]
path = "netpulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["netpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: testy z symulatorem SNMP (snmpsim)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
